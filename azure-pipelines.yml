trigger: 
-  main

pool: Todo_Microservice_Pool

stages:
- stage: Initial_Stage
  displayName: Pre Check
  jobs:
  - job: Terraform_Install
    displayName: Terraform Init
    steps: 
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'TodoApp_Service'
        backendAzureRmResourceGroupName: 'Brijendra_RG'
        backendAzureRmStorageAccountName: 'brijendrastoragelab'
        backendAzureRmContainerName: 'brijendracontainerlab'
        backendAzureRmKey: 'aksdev.terraformtfstate'


- stage: Scanning
  displayName: Scanning
  dependsOn: Initial_Stage
  jobs:
  - job: tfsec
    displayName: tfsec 
    continueOnError: True
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tfsec .
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
    

  - job: tflint
    dependsOn: tfsec
    displayName: TFLint
    continueOnError: True
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tflint --version
          tflint --init
          tflint
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
- stage: Planning
  dependsOn: Scanning
  displayName: Planning
  jobs:
  - job: Terraform_Plan
    displayName: Terraform_plan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'TodoApp_Service'
        backendAzureRmResourceGroupName: 'Brijendra_RG'
        backendAzureRmStorageAccountName: 'brijendrastoragelab'
        backendAzureRmContainerName: 'brijendracontainerlab'
        backendAzureRmKey: 'aksdev.terraformtfstate'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        environmentServiceNameAzureRM: 'TodoApp_Service'

- stage: Apply
  dependsOn: Planning
  displayName: Terraform Apply
  jobs:
  - job: Terraform_Apply
    displayName: Terraform Apply
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'TodoApp_Service'
        backendAzureRmResourceGroupName: 'Brijendra_RG'
        backendAzureRmStorageAccountName: 'brijendrastoragelab'
        backendAzureRmContainerName: 'brijendracontainerlab'
        backendAzureRmKey: 'aksdev.terraformtfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        environmentServiceNameAzureRM: 'TodoApp_Service'
