trigger: 
-  main

pool: Todo_Microservice_Pool

stages:
- stage: Initial_Stage
  displayName: Pre Check
  jobs:
  - job: Terraform_Install
    displayName: Terraform Init
    steps: 
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'TodoApp_Service'
        backendAzureRmResourceGroupName: 'Brijendra_RG'
        backendAzureRmStorageAccountName: 'brijendrastoragelab'
        backendAzureRmContainerName: 'brijendracontainerlab'
        backendAzureRmKey: 'aksdev.terraformtfstate'


- stage: Scannning
  displayName: Scanning
  dependsOn: Initial_Stage
  jobs:
  - job: tfsec
    displayName: tfsec 
    continueOnError: True
    steps:
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'
        dir: '''$(System.DefaultWorkingDirectory)/environments/dev'''

