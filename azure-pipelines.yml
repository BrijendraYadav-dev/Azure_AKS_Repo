trigger: 
-  main

pool: Todo_Microservice_Pool

stages:
- stage: Initial_Stage
  displayName: Pre Check
  jobs:
  - job: Terraform_Install
    displayName: Terraform Init
    steps: 
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        backendServiceArm: 'TodoApp_Service'
        backendAzureRmResourceGroupName: 'Brijendra_RG'
        backendAzureRmStorageAccountName: 'brijendrastoragelab'
        backendAzureRmContainerName: 'brijendracontainerlab'
        backendAzureRmKey: 'aksdev.terraformtfstate'


- stage: Scanning
  displayName: Scanning
  dependsOn: Initial_Stage
  jobs:
  - job: tfsec
    displayName: tfsec 
    continueOnError: True
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tfsec .
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
    

  - job: tflint
    dependsOn: tfsec
    displayName: TFLint
    continueOnError: True
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tflint --version
          tflint --init
          tflint
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
      
- stage: coststage
  dependsOn: Scanning
  displayName: Cost & Impact assesment stage
  jobs:
  - job: Infracost
    displayName: InfraCost
    steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: 'infracost breakdown --path=.'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'

    